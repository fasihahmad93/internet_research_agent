[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internet-research-agent"
version = "0.1.0"
description = "A locally runnable internet research agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",
    "fastapi>=0.110",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
research-agent = "research_agent.main:run"
research-plan = "research_agent.planner_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/research_agent/agent/prompts.yaml" = "research_agent/agent/prompts.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
